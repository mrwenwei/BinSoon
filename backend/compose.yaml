name: trashbin_soon

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    command: ["sh", "-c", "python -m scripts.initialize_db && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-${DEMO_ADMIN_TOKEN:-}}
      SIMULATION_CAPACITY_LITERS: ${SIMULATION_CAPACITY_LITERS:-${DEMO_CAPACITY_LITERS:-120}}
      SIMULATION_TIME_MULTIPLIER: ${SIMULATION_TIME_MULTIPLIER:-${DEMO_TIME_MULTIPLIER:-600}}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_CITIZEN_PASSWORD: ${DEMO_CITIZEN_PASSWORD:-}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      MEDIA_BACKEND: local
      MEDIA_DIRECTORY: /app/media
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TZ: UTC
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./data:/app/data:ro
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  media_data:
